<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>exercice4</title>
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Enquête de satisfaction</h2>
    <form>
        <div class="mb-4">
            <label class="form-label">
                Comment avez-vous connu notre site ?
            </label>

            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="source" id="reseaux">
                <label class="form-check-label" for="reseaux">
                    Réseaux sociaux
                </label>
            </div>

            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="source" id="amis">
                <label class="form-check-label" for="amis">
                    Amis
                </label>
            </div>

            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="source" id="publicite">
                <label class="form-check-label" for="publicite">
                    Publicité
                </label>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label">
                Quels sujets vous intéressent ?
            </label>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="html">
                <label class="form-check-label" for="html">
                    HTML / CSS
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="javascript">
                <label class="form-check-label" for="javascript">
                    JavaScript
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="bootstrap">
                <label class="form-check-label" for="bootstrap">
                    Bootstrap
                </label>
            </div>
        </div>
        <div class="mb-4">
            <label for="satisfaction" class="form-label">
                Note de satisfaction
            </label>
            <select class="form-select" id="satisfaction">
                <option selected>Choisissez une note</option>
                <option>Excellent</option>
                <option>Très bien</option>
                <option>Bien</option>
                <option>Moyen</option>
                <option>Insuffisant</option>
            </select>
        </div>
        <div class="mb-4">
            <label for="commentaire" class="form-label">
                Commentaires supplémentaires
            </label>

            <textarea class="form-control" id="commentaire" rows="4"
                placeholder="Écrivez vos commentaires ici"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">
            Envoyer
        </button>
    </form>
</div>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
