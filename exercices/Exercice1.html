<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>exercice1</title>
</head>
<body>
    <div class="container mt-5">
    <h2 class="text-center mb-4">Formulaire de contact</h2>
    <form>
  <div class="mb-3">
    <label for="nom" class="form-label">Nom</label>
    <input type="text" class="form-control" id="nom" aria-describedby="Entrez votre nom">
  </div>
   <div class="mb-3">
    <label for="Email" class="form-label">Email</label>
    <input type="email" class="form-control" id="email" aria-describedby="Entrez votre e-mail">
  </div>
  <div class="mb-3">
     <label for="sujet" class="form-label">Sujet</label>
  <select class="form-select" aria-label="Default select example">
   <option selected>Choisissez un sujet</option>
   <option value="1">un</option>
   <option value="2">deux</option>
   <option value="3">trois</option>
  </select>
</div>
<div class="mb-3"> 
     <label for="floatingTextarea">Message</label>
  <textarea class="form-control" placeholder="Écrivez votre message" id="message"></textarea>
</div>
 <button type="submit" class="btn btn-primary w-100">
    Envoyer
</button>
  </form>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
